<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Select Skill Group - {{ division }} {{ sport }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>{{ division }} &middot; {{ sport }}</h1>
        <p>{{ season }} {{ year }} &middot; Choose the skill group you're evaluating</p>
    </header>
    <main>
        {% if skill_groups %}
            {% for g in skill_groups %}
            <a class="card-link" href="/evaluate/{{ sport }}/{{ year }}/{{ season }}/{{ division }}/{{ g.id_skill_group }}">
                {{ g.group_name }}
            </a>
            {% endfor %}
        {% else %}
            <p class="empty-state">No skill groups have been set up for this division yet.</p>
        {% endif %}
    </main>
</body>
</html>
