<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Select Player - {{ group_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>{{ group_name }}</h1>
        <p>{{ division }} &middot; {{ sport }} &middot; {{ season }} {{ year }}</p>
    </header>
    <main>
        <a class="card-link" style="text-align:center; font-weight:600;" href="/evaluate/{{ sport }}/{{ year }}/{{ season }}/{{ division }}">&larr; Back to groups</a>

        <div class="section-title">Players to evaluate</div>
        <div id="player-list">
            {% for p in players %}
            <button class="list-btn" onclick="startGroup({{ p.id_reg }})">
                {{ p.first_name }} {{ p.last_name }}
            </button>
            {% else %}
            <p class="empty-state">All players have completed this skill group.</p>
            {% endfor %}
        </div>
    </main>

    <script>
        function startGroup(playerId) {
            // Go to the first skill (position 1) in this group for this player
            window.location.href = `/evaluate/{{ sport }}/{{ year }}/{{ season }}/{{ division }}/{{ skill_group_id }}/${playerId}/1`;
        }
    </script>
</body>
</html>
